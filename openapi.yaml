openapi: 3.0.3
info:
  title: CloudForge Nova Studio
  description: >-
    Studio ตัวที่สามของ CloudForge Platform — RAG (Retrieval-Augmented Generation):
    รับคำถาม, ดึงเอกสารที่เกี่ยวข้องจาก Knowledge Studio, ส่งให้ LLM ตอบพร้อมอ้างอิงแหล่งที่มา
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:8002
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /query:
    post:
      summary: ถามคำถามและรับคำตอบแบบ RAG
      operationId: postQuery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: คำตอบพร้อมแหล่งอ้างอิง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "401":
          description: Token ไม่ถูกต้องหรือหมดอายุ

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    QueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          description: คำถามจากผู้ใช้
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: จำนวนเอกสารที่ดึงมาจาก Knowledge Studio

    SourceDocument:
      type: object
      properties:
        text:
          type: string
        source:
          type: string
        score:
          type: number
          format: float

    QueryResponse:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDocument"
